# Foco en http://<servidor>/gestor-tareas/  (se incluye dentro del bloque server)
location = /gestor-tareas {
    return 301 /gestor-tareas/;
}
location ^~ /gestor-tareas/.git {
    return 404;
}
location /gestor-tareas/api/ {
    proxy_pass http://127.0.0.1:3020/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /gestor-tareas/ {
    alias /var/www/gestor-tareas/web/;
    index index.html;
    try_files $uri $uri/ /gestor-tareas/index.html;
    # Que una recarga normal traiga siempre la última versión publicada.
    add_header Cache-Control "no-cache";
}
