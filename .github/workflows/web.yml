name: Compilar web

# Compila la app web en cada push a main y la publica en la rama `web`,
# que el servidor descarga (ver deploy/actualizar.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

env:
  API_URL: ${{ vars.API_URL || 'http://2.25.102.3/gestor-tareas' }}
  BASE_HREF: ${{ vars.BASE_HREF || '/gestor-tareas/' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --base-href "$BASE_HREF" --dart-define=API_URL="$API_URL"

      - name: Publicar en la rama web
        working-directory: build/web
        run: |
          git init -q -b web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "web ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" web
